name: Test and generate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.13', '3.15.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python trader.py --mode demo
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-trader-${{ matrix.python }}-${{ github.run_id }}
          path: output/
          retention-days: 1
          if-no-files-found: error
